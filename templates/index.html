<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #0b1020; overflow: hidden; }
  * { box-sizing: border-box; font-family: Arial, Helvetica, sans-serif; }
  #map { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; }

  #panel {
    position: fixed; top: 14px; left: 14px; z-index: 10;
    background: rgba(16,22,46,0.88); backdrop-filter: blur(6px);
    border: 1px solid #2a3358; border-radius: 12px;
    padding: 14px 18px; color: #eee; max-width: 92vw;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  }
  #panel h1 { margin: 0 0 2px 0; font-size: 17px; }
  #subtitle { color: #9aa4c7; font-size: 11px; margin-bottom: 10px; }
  #panel-header { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
  #logo { height: 40px; border-radius: 4px; background: #fff; padding: 3px; }
  #controls { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }

  label { font-size: 12px; color: #cdd4ee; }

  .toggle-btn { padding: 5px 12px; border-radius: 20px; border: 1px solid #3a4470; background: #1a2144; color: #cdd4ee; cursor: pointer; font-size: 12px; }
  .toggle-btn.active { background: #4c7cf0; color: #fff; border-color: #4c7cf0; }
  .toggle-btn.metric.active { background: #e0663f; border-color: #e0663f; }
  .divider { width: 1px; height: 22px; background: #2a3358; }

  #stats {
    position: fixed; bottom: 14px; left: 14px; z-index: 10;
    background: rgba(16,22,46,0.88); backdrop-filter: blur(6px);
    border: 1px solid #2a3358; border-radius: 10px;
    padding: 8px 14px; color: #9aa4c7; font-size: 12px;
  }

  #route-panel {
    position: fixed; top: 78px; right: 14px; z-index: 10;
    background: rgba(16,22,46,0.92); backdrop-filter: blur(6px);
    border: 1px solid #2a3358; border-radius: 12px;
    padding: 12px 14px; color: #eee; width: 260px;
    max-height: 74vh; display: flex; flex-direction: column;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  }
  #route-panel-header { display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: bold; margin-bottom: 8px; }
  .mini-btn { font-size: 10px; padding: 3px 8px; border-radius: 12px; border: 1px solid #3a4470; background: #1a2144; color: #cdd4ee; cursor: pointer; margin-left: 4px; }
  #routeSearch { font-size: 12px; padding: 5px 8px; border-radius: 6px; border: 1px solid #3a4470; background: #1a2144; color: #fff; margin-bottom: 8px; width: 100%; }
  #route-list { overflow-y: auto; flex: 1; font-size: 12px; }
  .route-item { display: flex; align-items: center; gap: 6px; padding: 3px 2px; cursor: pointer; }
  .route-item:hover { background: rgba(76,124,240,0.15); border-radius: 4px; }
  .route-item input { flex-shrink: 0; }
  .route-item .swatch { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .route-item label { font-size: 11.5px; color: #cdd4ee; cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #route-list::-webkit-scrollbar { width: 6px; }
  #route-list::-webkit-scrollbar-thumb { background: #3a4470; border-radius: 3px; }

  /* Plotly modebar (zoom/pan/reset tools): bigger, always visible, white and bold */
  .modebar-container {
    position: fixed !important;
    top: 8px !important;
    right: 14px !important;
    z-index: 15 !important;
    transform: scale(1.275);
    transform-origin: top right;
  }
  .modebar-group { background: rgba(16,22,46,0.85) !important; border-radius: 8px; }
  .modebar-btn svg, .modebar-btn path {
    fill: #ffffff !important;
    filter: drop-shadow(0 0 0.6px #ffffff) drop-shadow(0 0 0.6px #ffffff);
  }
  .modebar-btn.active svg, .modebar-btn.active path,
  .modebar-btn:hover svg, .modebar-btn:hover path {
    fill: #4c7cf0 !important;
  }

<script>
let DATA = null;
const activeTypes = { cabotaje: true, internacional: true };
let activeMetric = 'ocup';
const deselectedRoutes = new Set(); // route keys (o + ' - ' + d) the user unchecked (fully hidden)
let selectedRoutes = new Set(); // route keys highlighted via click (others get dimmed, not hidden)
let lastCandidates = [];
const METRIC_LABELS = { ocup: 'Ocupación (pax/vuelo)', pax: 'Pasajeros', vuelos: 'Vuelos' };
const TYPE_COLORS = { cabotaje: 'rgba(90,200,150,0.75)', internacional: 'rgba(240,150,60,0.75)' };

function colorForRoute(routeKey) {
  // deterministic hash of the route name -> hue, so each route keeps a stable, distinct color
  let hash = 0;
  for (let i = 0; i < routeKey.length; i++) {
    hash = (hash * 31 + routeKey.charCodeAt(i)) >>> 0;
  }
  const hue = hash % 360;
  return `hsla(${hue}, 75%, 62%, 0.8)`;

function populateMonths() {
  const year = document.getElementById('yearSelect').value;
  const monthSelect = document.getElementById('monthSelect');
  const prevMonth = monthSelect.value;
  monthSelect.innerHTML = '';
  const months = DATA.year_months[year] || [];
  months.forEach(m => {
    const opt = document.createElement('option');
    opt.value = m; opt.textContent = m;
    monthSelect.appendChild(opt);
  });
  // keep previous month selection if still available, else pick last available month
  if (months.includes(prevMonth)) {
    monthSelect.value = prevMonth;
  } else {
    monthSelect.value = months[months.length - 1];
  }
}

function onYearChange() {
  populateMonths();
  render();
}

function toggleType(t) {
  activeTypes[t] = !activeTypes[t];
  document.getElementById('btn-' + t).classList.toggle('active');
  render();
}

// Grosor de línea fijo por ocupación (pax/vuelo)

// Great-circle interpolation (slerp) between two lat/lon points
function geodesicPoints(lat1, lon1, lat2, lon2, n = 40) {
  const toRad = deg => deg * Math.PI / 180, toDeg = r => r * 180 / Math.PI;
  const phi1 = toRad(lat1), lam1 = toRad(lon1), phi2 = toRad(lat2), lam2 = toRad(lon2);
  const d = 2 * Math.asin(Math.sqrt(Math.sin((phi2 - phi1) / 2) ** 2 +
            Math.cos(phi1) * Math.cos(phi2) * Math.sin((lam2 - lam1) / 2) ** 2));
  if (d === 0) return { lons: [lon1, lon2], lats: [lat1, lat2] };
  const lons = [], lats = [];
  for (let i = 0; i <= n; i++) {
    const f = i / n;
    const A = Math.sin((1 - f) * d) / Math.sin(d);
    const B = Math.sin(f * d) / Math.sin(d);
    const x = A * Math.cos(phi1) * Math.cos(lam1) + B * Math.cos(phi2) * Math.cos(lam2);
    const y = A * Math.cos(phi1) * Math.sin(lam1) + B * Math.cos(phi2) * Math.sin(lam2);
    const z = A * Math.sin(phi1) + B * Math.sin(phi2);
    const phi = Math.atan2(z, Math.sqrt(x * x + y * y));
    const lam = Math.atan2(y, x);
    lats.push(toDeg(phi));
    lons.push(toDeg(lam));
  }
  return { lons, lats };
}

function widthForValue(v, maxV) {
  if (v == null || !maxV) return 0.3;
  const t = Math.max(0, Math.min(1, v / maxV));
  return 0.35 + t * 3.2;
}

function updateRouteList(candidates) {
  const container = document.getElementById('route-list');
  container.innerHTML = '';
  candidates.forEach(r => {
    const key = r.o + ' - ' + r.d;
    const checked = !deselectedRoutes.has(key);
    const row = document.createElement('div');
    row.className = 'route-item';
    row.dataset.label = key.toLowerCase();

    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.checked = checked;
    cb.onchange = () => {
      if (cb.checked) deselectedRoutes.delete(key);
      else deselectedRoutes.add(key);
      renderMapOnly();
    };

    const swatch = document.createElement('span');
    swatch.className = 'swatch';
    swatch.style.background = colorForRoute(key);

    const label = document.createElement('label');
    label.textContent = r.o + ' → ' + r.d;

    row.appendChild(cb);
    row.appendChild(swatch);
    row.appendChild(label);
    row.onclick = (e) => { if (e.target !== cb) { cb.checked = !cb.checked; cb.onchange(); } };
    container.appendChild(row);
  });
}

function selectAllRoutes(select) {
  lastCandidates.forEach(r => {
    const key = r.o + ' - ' + r.d;
    if (select) deselectedRoutes.delete(key);
    else deselectedRoutes.add(key);
  });
  updateRouteList(lastCandidates);
  renderMapOnly();
}

function filterRouteList() {
  const q = document.getElementById('routeSearch').value.toLowerCase();
  document.querySelectorAll('#route-list .route-item').forEach(el => {
    el.style.display = el.dataset.label.includes(q) ? 'flex' : 'none';
  });
}

function renderMapOnly() {
  render(true);
}

function render(skipListRebuild) {
  if (!DATA) return;
  const year = document.getElementById('yearSelect').value;
  const month = document.getElementById('monthSelect').value;
  const ym = `${year}-${month}`;
  const traces = [];
  let totalVuelos = 0, totalPax = 0, nRoutes = 0;

  const candidates = []; // all routes available for current type+period (unfiltered by user selection)
  if (skipListRebuild) {
    candidates.push(...lastCandidates);
  } else {
    for (const tipo of ['cabotaje', 'internacional']) {
      if (!activeTypes[tipo]) continue;
      const meta = DATA[tipo].meta;
      const rows = DATA[tipo].data[ym] || [];
      for (const [idx, vuelos, pax, ocup] of rows) {
        if (!vuelos) continue;
        const [o, d, olat, olon, dlat, dlon] = meta[idx];
        candidates.push({ o, d, olat, olon, dlat, dlon, vuelos, pax, ocup, tipo });
      }
    }
    candidates.sort((a, b) => (a.o + a.d).localeCompare(b.o + b.d));
    lastCandidates = candidates;
    updateRouteList(candidates);
  }

  const visible = candidates.filter(r => !deselectedRoutes.has(r.o + ' - ' + r.d));

  const maxMetric = Math.max(1, ...visible.map(r => (r[activeMetric] != null ? r[activeMetric] : 0)));

  for (const r of visible) {
    totalVuelos += r.vuelos;
    totalPax += (r.pax || 0);
    nRoutes++;
    const { lons, lats } = geodesicPoints(r.olat, r.olon, r.dlat, r.dlon);
    const width = widthForValue(r[activeMetric], maxMetric);
    const routeKey = r.o + ' - ' + r.d;
    const routeColor = colorForRoute(routeKey);
    const isDimmed = selectedRoutes.size > 0 && !selectedRoutes.has(routeKey);
    traces.push({
      type: 'scattergeo',
      mode: 'lines',
      lon: lons,
      lat: lats,
      line: { width: width, color: routeColor },
      opacity: isDimmed ? 0.12 : 1,
      hoverinfo: 'text',
      text: `${r.o} → ${r.d}<br>Vuelos: ${r.vuelos.toLocaleString('es-AR')}<br>Pasajeros: ${(r.pax||0).toLocaleString('es-AR')}<br>Ocupación: ${r.ocup != null ? r.ocup : 'N/D'} pax/vuelo`,
      customdata: new Array(lons.length).fill(routeKey),
      showlegend: false
    });
  }

  // Node layer: red dots per airport/city, sized by total passengers through that airport (Table 11)
  // Only nodes belonging to currently visible routes are shown
  const visibleNodeNames = new Set();
  for (const r of visible) { visibleNodeNames.add(r.o); visibleNodeNames.add(r.d); }

  const nodeMeta = DATA.nodes.meta; // [name, lat, lon, hasData]
  const nodeRows = DATA.nodes.data[ym] || []; // [nodeIdx, paxTotal]
  const nodePax = {};
  for (const [idx, pax] of nodeRows) nodePax[idx] = pax;
  const maxNodePax = Math.max(1, ...Object.values(nodePax));

  const nodeLons = [], nodeLats = [], nodeSizes = [], nodeTexts = [];
  nodeMeta.forEach((n, idx) => {
    const [name, lat, lon, hasData] = n;
    if (!visibleNodeNames.has(name)) return;
    nodeLons.push(lon);
    nodeLats.push(lat);
    if (hasData && nodePax[idx] != null) {
      const t = Math.max(0, Math.min(1, nodePax[idx] / maxNodePax));
      nodeSizes.push(5 + t * 28);
      nodeTexts.push(`${name}<br>Pasajeros totales: ${nodePax[idx].toLocaleString('es-AR')}`);
    } else {
      nodeSizes.push(6);
      nodeTexts.push(`${name}<br>(sin datos de pasajeros totales por aeropuerto)`);
    }
  });

  traces.push({
    type: 'scattergeo',
    mode: 'markers',
    lon: nodeLons,
    lat: nodeLats,
    marker: { size: nodeSizes, color: 'rgba(230,30,30,0.85)', line: { width: 0.5, color: '#fff' } },
    hoverinfo: 'text',
    text: nodeTexts,
    showlegend: false
  });

  // Dynamically compute lon/lat range so the map fills the viewport edge-to-edge,
  // regardless of screen aspect ratio (natural earth projection ~2:1 lon:lat visual ratio)
  const vw = window.innerWidth, vh = window.innerHeight;
  const aspect = vw / vh;
  const latSpan = 130; // degrees of latitude shown, fixed
  const lonSpan = Math.min(340, latSpan * aspect * 1.75);
  const lonCenter = -30, latCenter = -5;

  const layout = {
    geo: {
      projection: { type: 'natural earth' },
      showland: true, landcolor: '#1a2144',
      showocean: true, oceancolor: '#0b1020',
      showcountries: true, countrycolor: '#3a4470',
      showcoastlines: true, coastlinecolor: '#3a4470',
      bgcolor: '#0b1020',
      domain: { x: [0, 1], y: [0, 1] },
      lataxis: { range: [latCenter - latSpan/2, latCenter + latSpan/2] },
      lonaxis: { range: [lonCenter - lonSpan/2, lonCenter + lonSpan/2] },
      uirevision: 'keep-view'
    },
    uirevision: 'keep-view',
    paper_bgcolor: '#0b1020',
    plot_bgcolor: '#0b1020',
    margin: { t: 0, b: 0, l: 0, r: 0 },
    font: { color: '#eee' },
    autosize: true,
    hoverlabel: {
      bgcolor: 'rgba(25,30,55,0.95)',
      bordercolor: '#4c7cf0',
      font: { color: '#ffffff', size: 13, family: 'Arial Black, Arial, sans-serif' }
    },
    modebar: {
      color: '#ffffff',
      activecolor: '#4c7cf0',
      bgcolor: 'rgba(16,22,46,0.85)'
    }
  };

  Plotly.react('map', traces, layout, { responsive: true, displaylogo: false, displayModeBar: true })
    .then(gd => {
      if (!gd._clickHandlerAttached) {
        gd._clickHandlerAttached = true;
        gd.on('plotly_click', (evt) => {
          plotlyClickJustFired = true;
          const pt = evt.points && evt.points[0];
          const key = pt && pt.customdata;
          if (!key) return; // clicked a node marker or something without a route key
          const ctrl = evt.event && (evt.event.ctrlKey || evt.event.metaKey);
          if (ctrl) {
            if (selectedRoutes.has(key)) selectedRoutes.delete(key);
            else selectedRoutes.add(key);
          } else {
            selectedRoutes = new Set([key]);
          }
          renderMapOnly();
        });
      }
    });

  document.getElementById('stats').textContent =
    `${month} ${year} — ${nRoutes} rutas · ${totalVuelos.toLocaleString('es-AR')} vuelos · ${totalPax.toLocaleString('es-AR')} pasajeros · grosor = ${METRIC_LABELS[activeMetric]}`;
}

let plotlyClickJustFired = false;
document.getElementById('map').addEventListener('click', () => {
  setTimeout(() => {
    if (!plotlyClickJustFired && selectedRoutes.size > 0) {
      selectedRoutes.clear();
      renderMapOnly();
    }
    plotlyClickJustFired = false;
  }, 0);
});

window.addEventListener('resize', () => render());
</script>
