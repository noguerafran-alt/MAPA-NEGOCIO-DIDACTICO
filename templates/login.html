<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Admin — Rutas Aéreas Argentinas</title>
<style>
  body { font-family: Arial, sans-serif; background: #0b1020; color: #eee; display: flex;
         align-items: center; justify-content: center; height: 100vh; margin: 0; }
  form { background: #10162e; padding: 30px 36px; border-radius: 12px; border: 1px solid #2a3358; width: 300px; }
  h1 { font-size: 18px; margin-top: 0; }
  input { width: 100%; padding: 10px; margin: 10px 0; border-radius: 6px; border: 1px solid #3a4470;
          background: #1a2144; color: #fff; box-sizing: border-box; }
  button { width: 100%; padding: 10px; border-radius: 6px; border: none; background: #4c7cf0;
           color: #fff; font-weight: bold; cursor: pointer; }
  a { color: #9aa4c7; font-size: 12px; }
</style>
</head>
<body>
  <form method="POST" action="/admin/login">
    <h1>🔒 Panel de administración</h1>
    <input type="password" name="password" placeholder="Contraseña" required autofocus>
    <button type="submit">Entrar</button>
    <p><a href="/">← Volver al mapa</a></p>
  </form>
</body>
</html>
